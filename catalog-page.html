<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カタログページ</title>
    <style>
      :root {
        color: #172421;
        background: #f7fbf9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid #d9e6e2;
        background: rgba(247, 251, 249, 0.96);
      }

      h1 {
        margin: 0;
        font-size: 17px;
      }

      a {
        color: #0f6a5f;
        font-weight: 700;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 16px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #d9e6e2;
        background: #ffffff;
      }

      .fallback {
        padding: 16px;
        border: 1px solid #d9e6e2;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="pageTitle">カタログページ</h1>
      <a id="pdfLink" href="acolclub.pdf" target="_blank" rel="noreferrer">PDFで開く</a>
    </header>
    <main>
      <img id="catalogImage" alt="">
      <p class="fallback" id="fallback" hidden>
        ページ画像を表示できませんでした。上の「PDFで開く」からカタログを確認してください。
      </p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const pdfPage = Number(params.get("page"));
      const printedPage = params.get("print") || "";
      const isValidPage = Number.isInteger(pdfPage) && pdfPage > 0;
      const pageLabel = printedPage ? `P${printedPage}` : `PDF ${pdfPage}ページ`;
      const title = isValidPage ? `カタログ ${pageLabel}` : "カタログページ";
      const pageTitle = document.getElementById("pageTitle");
      const pdfLink = document.getElementById("pdfLink");
      const image = document.getElementById("catalogImage");
      const fallback = document.getElementById("fallback");

      pageTitle.textContent = title;
      document.title = title;

      if (isValidPage) {
        image.src = `assets/catalog-pages/page-${pdfPage}.jpg`;
        image.alt = title;
        pdfLink.href = `acolclub.pdf#page=${pdfPage}`;
      } else {
        image.hidden = true;
        fallback.hidden = false;
      }

      image.addEventListener("error", () => {
        image.hidden = true;
        fallback.hidden = false;
      });
    </script>
  </body>
</html>
